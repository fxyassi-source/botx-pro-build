name: BotX Pro V56.0.2 Play Store AAB

on:
  pull_request:
    branches: [main]
    paths:
      - 'release-trigger/aab/**'
      - '.github/workflows/release-android-aab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_FILE_ID: 1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08
      SOURCE_SHA256: 4959b825a3aa7758513f97e647778ac594596d447131ba17fc600b7dbee01f93
      PATCH_SHA256: 659eef1211a2847af09a8e58c493f7de8a00b6534be6f1aac89fa5097b1209b8
      SIGNING_TAG: botx-android-signing-v1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Stage locked V56.0.1 source and apply Target-8 patch
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output app.tgz \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t"
          echo "${SOURCE_SHA256}  app.tgz" | sha256sum --check --strict
          mkdir app
          tar -xzf app.tgz -C app
          base64 -d patches/BOTX_PRO_V56_0_2_TARGET8.patch.gz.b64 | gzip -dc > target8.patch
          echo "${PATCH_SHA256}  target8.patch" | sha256sum --check --strict
          patch -p1 -d app < target8.patch
          grep -q '^version: 56.0.2+5602$' app/pubspec.yaml

      - name: Restore persistent release signing identity
        run: |
          set -euo pipefail
          mkdir -p signing
          gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'botx-release.jks' \
            --pattern 'botx-signing.env' \
            --dir signing --clobber
          source signing/botx-signing.env
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          cp signing/botx-release.jks app/android/app/botx-release.jks
          cat > app/android/key.properties <<EOF
          storeFile=botx-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Build signed Play Store AAB
        working-directory: app
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --build-name=56.0.2 --build-number=5602 \
            --dart-define=BOTX_ENV=release-candidate 2>&1 | tee ../build-aab.log

      - name: Verify and package AAB
        run: |
          set -euo pipefail
          mkdir -p dist
          AAB='app/build/app/outputs/bundle/release/app-release.aab'
          test -s "${AAB}"
          jarsigner -verify -strict -certs "${AAB}" | tee aab-signature-verification.txt
          cp "${AAB}" dist/BotXPro-V56.0.2-Target8-PlayStore.aab
          cp build-aab.log aab-signature-verification.txt dist/
          (cd dist && sha256sum BotXPro-V56.0.2-Target8-PlayStore.aab > SHA256SUMS.txt)

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-V56.0.2-Target8-PlayStore-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 30
