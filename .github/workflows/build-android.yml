name: BotX Pro Android Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Download verified private build source
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output mobile_flutter_15.0.7.tar.gz \
            "https://drive.usercontent.google.com/download?id=1gIEZqbEYcq9fgMDblbQ8lS-MMnSAzlkt&export=download&confirm=t"
          echo "aa3e034d6199a15f021332e9adf6e8164a9cc37db8fb846b984c59f37d48678d  mobile_flutter_15.0.7.tar.gz" | sha256sum --check --strict
          mkdir -p app
          tar -xzf mobile_flutter_15.0.7.tar.gz -C app
          test -f app/pubspec.yaml
          test -f app/android/app/build.gradle.kts

      - name: Verify cloud toolchain
        run: |
          java -version
          flutter --version
          flutter doctor -v

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Static analysis gate
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Flutter tests gate
        working-directory: app
        run: flutter test

      - name: Build installable debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Validate APK identity and signature
        run: |
          APK="app/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='pro.botx.app' versionCode='1507' versionName='15.0.7'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-verification.txt
          sha256sum "$APK" | tee BotX_Pro_15_0_7_Debug_APK.sha256
          cp "$APK" BotX_Pro_Master_V14_15_0_7_Debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-Master-V14-15.0.7-Debug-APK
          path: |
            BotX_Pro_Master_V14_15_0_7_Debug.apk
            BotX_Pro_15_0_7_Debug_APK.sha256
            apk-badging.txt
            apksigner-verification.txt
          if-no-files-found: error
          retention-days: 14
