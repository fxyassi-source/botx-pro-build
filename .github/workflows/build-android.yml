name: BotX Pro Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Verify cloud toolchain
        run: |
          java -version
          flutter --version
          flutter doctor -v

      - name: Source staging gate
        run: |
          echo 'Workflow skeleton is ready.'
          echo 'Verified Master V14 source will be staged only after repository visibility is confirmed Private.'
