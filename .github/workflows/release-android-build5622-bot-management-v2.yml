name: BotX Pro V56.0.3 Build5622 Strategy Management V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'patches/build5622/**'
      - '.github/workflows/release-android-build5622-bot-management-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: botx-build5622-strategy-management-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_RUN_ID: '30689470263'
      BASE_ARTIFACT: BotX-Pro-V56.0.3-Consolidated-Institutional-Delivery-Build5620
      BASE_SOURCE_ZIP: BotXPro-V56.0.3-Consolidated-Full-App-Source-Build5620.zip
      PATCH_SHA: f0089435377c8e95236d4240f0304ec518892ee900ec3b002c1c5da040a9e158
      APK_NAME: BotXPro-V56.0.3-Strategy-Management-Build5622.apk
      SOURCE_NAME: BotXPro-V56.0.3-Strategy-Management-Source-Build5622.zip

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT }}
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}

      - name: Reconstruct exact Build5622 source
        run: |
          set -euo pipefail
          mkdir app extracted
          unzip -q "previous/${BASE_SOURCE_ZIP}" -d extracted
          ROOT="$(dirname "$(find extracted -maxdepth 4 -name pubspec.yaml | head -1)")"
          test -n "$ROOT"
          cp -a "$ROOT/." app/
          find app/lib/core/theme -type f -print0 | sort -z | xargs -0 sha256sum > theme-before.sha256
          cat patches/build5622/chunks/part-*.b64 > build5622.b64
          base64 -d build5622.b64 | gzip -dc > build5622.patch
          test -s build5622.patch
          echo "${PATCH_SHA}  build5622.patch" | sha256sum -c --strict
          patch -p1 -d app < build5622.patch
          grep -q '^version: 56.0.3+5622$' app/pubspec.yaml
          test ! -e app/lib/app/local_demo_engine.dart
          test ! -e app/test/local_demo_engine_test.dart
          test ! -e app/assets/v56/index.html

      - name: Restore authenticated release signing identity
        run: |
          set -euo pipefail
          mkdir signing
          gh release download botx-android-signing-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern botx-release.jks --pattern botx-signing.env --dir signing --clobber
          source signing/botx-signing.env
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          cp signing/botx-release.jks app/android/app/botx-release.jks
          printf 'storeFile=botx-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/android/key.properties

      - name: Format and enforce actual Build5622 contracts
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/app/botx_app.dart \
            lib/app/v16_app_controller.dart \
            lib/app/v56_native_shell.dart \
            lib/core/paper/local_paper_engine.dart \
            test/local_paper_engine_test.dart \
            test/v56_demo_setup_flow_test.dart \
            test/v56_ui_smoke_test.dart
          cd ..
          find app/lib/core/theme -type f -print0 | sort -z | xargs -0 sha256sum > theme-after.sha256
          diff -u theme-before.sha256 theme-after.sha256
          python3 - <<'PY'
          from pathlib import Path
          shell = Path('app/lib/app/v56_native_shell.dart').read_text()
          controller = Path('app/lib/app/v16_app_controller.dart').read_text()
          engine = Path('app/lib/core/paper/local_paper_engine.dart').read_text()
          app = Path('app/lib/app/botx_app.dart').read_text()
          smoke = Path('app/test/v56_ui_smoke_test.dart').read_text()
          engine_test = Path('app/test/local_paper_engine_test.dart').read_text()
          demo_test = Path('app/test/v56_demo_setup_flow_test.dart').read_text()
          required_shell = [
              'v56_dca_entry_section',
              'v56_dca_order_section',
              'v56_dca_exit_section',
              'v56_dca_risk_section',
              'v56_grid_structure_section',
              'v56_grid_exit_section',
              'v56_grid_risk_section',
              'v56_hft_execution_section',
              'v56_hft_risk_section',
              'v56_ai_intelligence_section',
              'v56_ai_risk_section',
              'v56_manage_bot_settings',
              "label: const Text('Rename')",
              "label: const Text('Duplicate')",
              "label: const Text('Rollback')",
              "label: const Text('Delete')",
              "'Mean reversion'",
              "'Breakout'",
              "'HFT'",
              'v56_custom_archetype_',
              'Review & deploy bot',
          ]
          missing = [token for token in required_shell if token not in shell]
          assert not missing, f'Missing shell contracts: {missing}'
          for method in ['renameBot(', 'duplicateBot(', 'deleteBot(', 'deployBotVersion(', 'rollbackBotVersion(']:
              assert method in controller, f'Controller missing {method}'
              assert method in engine, f'Engine missing {method}'
          assert '_evaluateCustomRuleBot' in engine
          assert 'maxAckLatencyMs' in shell and 'maxQuoteAgeMs' in shell
          assert 'minimumConfidencePct' in shell and 'noTradeThresholdPct' in shell
          assert 'safetyOrderVolumeScale' in shell and 'maximumAveragingOrders' in shell
          assert 'gridLevels' in shell and 'gridRangePct' in shell
          assert 'ALLOW_GUEST_PREVIEW' in app and '_allowGuestPreview' in app
          assert '_V56GuestPreviewBanner' not in shell
          assert 'v56_guest_preview_banner' not in shell
          assert 'VERIFIED_PAPER_QUOTE_REQUIRED' not in engine
          assert 'query2.finance.yahoo.com' in engine
          assert '_queuedSymbols' in engine and '_refreshCompletion' in engine
          assert 'HFT deployment exposes execution-specific controls' in smoke
          assert 'AI Institutional deployment exposes intelligence-specific controls' in smoke
          assert 'DCA and Grid use separate strategy-specific management flows' in smoke
          assert 'Custom bot builder exposes archetypes and management lifecycle' in smoke
          assert 'custom bot management preserves versioned strategy-specific settings' in engine_test
          assert "find.byKey(const ValueKey('v56_guest_preview_banner'))" in demo_test
          assert 'findsNothing' in demo_test and 'lessThan(100)' in demo_test
          PY
          ! grep -R -n --fixed-strings 'VERIFIED_PAPER_QUOTE_REQUIRED' app/lib
          ! grep -R -n --fixed-strings 'BotX Paper Broker' app/lib app/assets
          ! grep -R -n --fixed-strings 'BotX Demo Simulator' app/lib app/assets
          ! find app -type f \( -name '*.jks' -o -name '*.keystore' \) -not -path 'app/android/app/botx-release.jks' | grep .

      - name: Flutter analyze zero issues
        id: analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../analyze-build5622.log

      - name: Complete non-visual Flutter regression suite
        id: tests
        working-directory: app
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find test -type f -name '*_test.dart' ! -name 'v56_visual_capture_test.dart' | sort)
          test "${#TESTS[@]}" -gt 0
          timeout 50m flutter test --concurrency=1 --reporter expanded "${TESTS[@]}" 2>&1 | tee ../tests-build5622.log

      - name: Build fresh signed QA release APK
        id: build
        working-directory: app
        run: |
          set -o pipefail
          timeout 55m flutter build apk --release \
            --build-name=56.0.3 --build-number=5622 \
            --dart-define=BOTX_ENV=release-candidate \
            --dart-define=ALLOW_LIVE_MODE=false \
            --dart-define=ALLOW_GUEST_PREVIEW=true 2>&1 | tee ../build-build5622.log

      - name: Verify signature source hygiene and archives
        id: package
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner-build5622.log
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner-build5622.log
          mkdir delivery
          cp "$APK" "delivery/${APK_NAME}"
          rm -f app/android/app/botx-release.jks app/android/key.properties
          rm -rf app/build app/.dart_tool app/android/.gradle
          ! find app -type f \( -name '*.jks' -o -name '*.keystore' -o -name key.properties \) | grep .
          (cd app && zip -9 -qr "../delivery/${SOURCE_NAME}" . -x '.git/*' 'build/*' '.dart_tool/*' 'android/.gradle/*')
          cp analyze-build5622.log tests-build5622.log build-build5622.log \
            apksigner-build5622.log build5622.patch theme-before.sha256 theme-after.sha256 delivery/
          cat > delivery/BUILD5622_RELEASE_REPORT.md <<'EOF'
          # BotX Pro V56.0.3 Build5622 — Strategy-Specific Bot Management
          DCA, Grid, HFT and AI Institutional use separate deployment management flows instead of one generic form.
          User-created bots support strategy archetypes, edit, rename, duplicate, immutable new-version deployment, rollback and guarded delete.
          Paper execution uses attributed public delayed quotes, queued symbol refresh, query-host fallback and shared risk gates. No order is fabricated when a valid quote is unavailable.
          The permanent Home paper-warning banner is removed so the Portfolio starts directly below the header. This QA build enables guest preview; production must compile with ALLOW_GUEST_PREVIEW=false.
          Theme files remain byte-identical to the Build5620 authority. ALLOW_LIVE_MODE=false.
          EOF
          (cd delivery && sha256sum * > SHA256SUMS.txt)
          unzip -tq "delivery/${SOURCE_NAME}"
          unzip -tq "delivery/${APK_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-V56.0.3-Strategy-Management-Delivery-Build5622-V2
          path: delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enforce every Build5622 release gate
        if: always()
        run: |
          set -euo pipefail
          test '${{ steps.analyze.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.package.outcome }}' = success
