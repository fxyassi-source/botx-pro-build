name: Diagnose Build5620 Patch Chunks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-build5620-patch-chunks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact repository chunk integrity
        run: |
          set -u
          for f in patches/build5620/chunks/part-*.b64; do
            echo "FILE=$f BYTES=$(wc -c < "$f") LINES=$(wc -l < "$f")"
            sha256sum "$f"
          done
          cat patches/build5620/chunks/part-*.b64 | tr -d '\r\n\t ' > combined.b64
          echo "COMBINED_BYTES=$(wc -c < combined.b64)"
          sha256sum combined.b64
          base64 -d combined.b64 > patch.gz
          echo "GZIP_BYTES=$(wc -c < patch.gz)"
          sha256sum patch.gz
          gzip -t patch.gz
          gzip -dc patch.gz > patch.diff
          echo "PATCH_BYTES=$(wc -c < patch.diff)"
          sha256sum patch.diff
