name: BotX Pro V56 One-Pass Final Review APK

on:
  pull_request:
    branches:
      - v56-onepass-final-base-20260726

permissions:
  contents: read
  actions: read

jobs:
  build-onepass-v56-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOURCE_FILE_ID: 1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08
      SOURCE_SHA256: 68ba3cc8a43347ed92c0a904da96bd23e94041f4eb92b07c1e4b65a860ba6b4d
      RECONSTRUCTION_SHA: b1689b8159ac0f555fa6658f857e5b9d9b473bc840a6a4566ff2b8421f88b70f
      DEMO_SHA: bd74e5546206dfd1c41ccf967c2ee5105a8ca9ebcfa53e3d88bbb4269b95b076
      LOGO_SHA: 55cb6efb6c0879e2cb15e235a86ae645a29123a81136f26cae302e2b97465bb8
      PERSISTENCE_SHA: 8bee1cab3afdc6fb215eccc5ee95b2836fdf597daee245323ea05b18b7058188
      DISPOSE_SHA: 31c075d5d1388b7681b6f96e7a5c391be7d408ad42f801584372c8a74cd9562c
      UI_SHA: 01bcfb500fa179225ea3c65c0cf5169f1009761707702c5a2a9b4d5ebfaff368
      VISUAL_SHA: 7b67d331e6c0e31d6a49feb5a65619dbad142f4c39e66a6f0dccf37fb8823bba
      REPAIRED_SOURCE_ARTIFACT_ID: 8630548485
      PAYLOAD_B64_SHA256: bbda828f9fa94e0506b9d4e4e8283ce508330afc0e6db2025e0e88350f0e1a5b
      PAYLOAD_GZ_SHA256: 48bfaa6d896a62606ecfe654de8adc10cb7f5d3926df4d0df936fc55e7cdfc43
      ONEPASS_PATCH_SHA256: 90487d9e341d3d2f6ed25a64fc64b96057b4bdeaf9658b4e299c40463139f690

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up exact Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Reconstruct certified V56 mobile authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v56" "$GITHUB_WORKSPACE/app"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t" \
            -o "$RUNNER_TEMP/v56/source.tar.gz"
          echo "${SOURCE_SHA256}  $RUNNER_TEMP/v56/source.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/v56/source.tar.gz" -C "$GITHUB_WORKSPACE/app"

          fetch_patch() {
            local name="$1" path="$2" expected="$3"
            curl --fail --location --retry 5 --retry-delay 3 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/d39318ee5540632b6fbd81fb413b2455e845e6f7/${path}" \
              -o "$RUNNER_TEMP/v56/${name}.patch"
            echo "${expected}  $RUNNER_TEMP/v56/${name}.patch" | sha256sum --check --strict
          }
          fetch_patch reconstruction .github/v56_patches/v56-reconstruction-mobile-fix.patch "$RECONSTRUCTION_SHA"
          fetch_patch demo .github/v56_patches/v56-demo-certification-fix.patch "$DEMO_SHA"
          fetch_patch logo .github/v56_patches/v56-logo-test-optimization-v7.patch "$LOGO_SHA"
          fetch_patch persistence .github/v56_patches/v56-brokerless-demo-persistence.patch "$PERSISTENCE_SHA"
          fetch_patch dispose .github/v56_patches/v56-demo-dispose-async-fix.patch "$DISPOSE_SHA"
          fetch_patch ui .github/v56_patches/v56-ui-smoke-test-fix-v9-clean.patch "$UI_SHA"
          fetch_patch visual .github/v56_patches/v56-visual-capture-async-fix.patch "$VISUAL_SHA"
          cd "$GITHUB_WORKSPACE/app"
          for name in reconstruction demo logo persistence dispose ui visual; do
            patch --batch --forward -p1 < "$RUNNER_TEMP/v56/${name}.patch"
          done
          grep -F 'version: 56.0.0+5600' pubspec.yaml

      - name: Restore targeted repaired source authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REPAIRED_SOURCE_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/v56/repaired.zip"
          mkdir -p "$RUNNER_TEMP/v56/repaired"
          unzip -q "$RUNNER_TEMP/v56/repaired.zip" -d "$RUNNER_TEMP/v56/repaired"
          SRC_ROOT="$(python3 - <<'PY'
          from pathlib import Path
          root = Path(r'''${{ runner.temp }}/v56/repaired''')
          matches = list(root.rglob('app/lib/app/botx_app.dart'))
          if len(matches) != 1:
              raise SystemExit(f'expected one repaired source root, found {len(matches)}')
          print(matches[0].parents[2])
          PY
          )"
          cp "$SRC_ROOT/lib/app/botx_app.dart" app/lib/app/botx_app.dart
          cp "$SRC_ROOT/lib/app/local_demo_engine.dart" app/lib/app/local_demo_engine.dart
          cp "$SRC_ROOT/lib/app/market_identity_logo.dart" app/lib/app/market_identity_logo.dart
          cp "$SRC_ROOT/lib/app/v56_native_shell.dart" app/lib/app/v56_native_shell.dart
          cp "$SRC_ROOT/lib/features/market/trading_view_chart.dart" app/lib/features/market/trading_view_chart.dart
          cp "$SRC_ROOT/test/market_identity_logo_test.dart" app/test/market_identity_logo_test.dart
          cp "$SRC_ROOT/test/v56_ui_smoke_test.dart" app/test/v56_ui_smoke_test.dart

          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF}/.github/v56_targeted/pubspec.yaml" \
            -o app/pubspec.yaml
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF}/.github/v56_targeted/listtile-material-fix.patch" \
            -o "$RUNNER_TEMP/v56/listtile-material-fix.patch"
          cd app
          patch --batch --forward -p1 < "$RUNNER_TEMP/v56/listtile-material-fix.patch"

      - name: Verify and apply one-pass UI and paper-data patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cat .github/v56_onepass_payload/p*.txt > "$RUNNER_TEMP/v56/onepass.patch.gz.b64"
          echo "${PAYLOAD_B64_SHA256}  $RUNNER_TEMP/v56/onepass.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/v56/onepass.patch.gz.b64" > "$RUNNER_TEMP/v56/onepass.patch.gz"
          echo "${PAYLOAD_GZ_SHA256}  $RUNNER_TEMP/v56/onepass.patch.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/v56/onepass.patch.gz" > "$RUNNER_TEMP/v56/onepass.patch"
          echo "${ONEPASS_PATCH_SHA256}  $RUNNER_TEMP/v56/onepass.patch" | sha256sum --check --strict

          mapfile -t changed < <(grep '^+++ b/' "$RUNNER_TEMP/v56/onepass.patch" | sed 's#^+++ b/##' | sort -u)
          printf '%s\n' "${changed[@]}" > "$RUNNER_TEMP/v56/onepass-changed-files.txt"
          diff -u <(printf '%s\n' \
            lib/app/botx_app.dart \
            lib/app/local_demo_engine.dart \
            lib/app/v56_native_shell.dart \
            lib/features/market/trading_view_chart.dart | sort) \
            "$RUNNER_TEMP/v56/onepass-changed-files.txt"

          cd "$GITHUB_WORKSPACE/app"
          sha256sum lib/core/theme/v56_theme.dart lib/core/theme/botx_palette.dart > "$RUNNER_TEMP/v56/themes-before.sha256"
          patch --batch --forward -p1 < "$RUNNER_TEMP/v56/onepass.patch"
          sha256sum --check "$RUNNER_TEMP/v56/themes-before.sha256"

      - name: Verify owner-locked defect contracts
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'class _V56BotGlassSurface' lib/app/v56_native_shell.dart
          grep -F "ValueKey('v56_custom_bot_fullscreen')" lib/app/v56_native_shell.dart
          grep -F 'Build and test trading' lib/app/v56_native_shell.dart
          grep -F 'class _XmMarketDetailScreen' lib/app/v56_native_shell.dart
          grep -F 'class _MarketSymbolTile' lib/app/v56_native_shell.dart
          grep -F 'hide_top_toolbar: true' lib/features/market/trading_view_chart.dart
          grep -F 'hide_side_toolbar: true' lib/features/market/trading_view_chart.dart
          grep -F 'hide_legend: true' lib/features/market/trading_view_chart.dart
          grep -F 'api.gold-api.com' lib/app/local_demo_engine.dart
          grep -F 'data-api.binance.vision' lib/app/local_demo_engine.dart
          grep -F 'query1.finance.yahoo.com' lib/app/local_demo_engine.dart
          grep -F 'Real-price demo · paper execution' lib/app/local_demo_engine.dart
          grep -F 'Deterministic test fixture' lib/app/local_demo_engine.dart
          grep -F "ValueKey('v56_login_signup')" lib/app/botx_app.dart
          grep -F "ValueKey('v56_bots_start_button')" lib/app/v56_native_shell.dart
          test "$(grep -c "key: '.*'" lib/core/theme/v56_theme.dart)" -ge 8
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Configure isolated review signing
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle.properties')
          rows = path.read_text().splitlines() if path.exists() else []
          additions = {
              'org.gradle.jvmargs=': 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8',
              'org.gradle.workers.max=': 'org.gradle.workers.max=1',
              'kotlin.daemon.jvmargs=': 'kotlin.daemon.jvmargs=-Xmx1024m',
          }
          out=[]; seen=set()
          for row in rows:
              key=next((k for k in additions if row.startswith(k)), None)
              if key:
                  if key not in seen: out.append(additions[key]); seen.add(key)
              else: out.append(row)
          for key,value in additions.items():
              if key not in seen: out.append(value)
          path.write_text('\n'.join(out)+'\n')
          PY
          keytool -genkeypair -keystore android/app/v56-onepass-review.jks \
            -storepass botx-v56-onepass -keypass botx-v56-onepass \
            -alias v56onepass -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=BotX Pro V56 One-Pass Review, OU=Testing, O=BotX AI, L=Faridabad, ST=Haryana, C=IN"
          cat > android/key.properties <<'EOF'
          storePassword=botx-v56-onepass
          keyPassword=botx-v56-onepass
          keyAlias=v56onepass
          storeFile=v56-onepass-review.jks
          EOF

      - name: Strict analyze and reliable regression gates
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pub-get.log"
          dart format lib/app/botx_app.dart lib/app/local_demo_engine.dart \
            lib/app/v56_native_shell.dart lib/features/market/trading_view_chart.dart \
            2>&1 | tee "$RUNNER_TEMP/format.log"
          flutter analyze --fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.log"
          flutter test --concurrency=1 --reporter expanded test/market_identity_logo_test.dart \
            2>&1 | tee "$RUNNER_TEMP/logo-tests.log"
          flutter test --concurrency=1 --reporter expanded test/local_demo_engine_test.dart \
            2>&1 | tee "$RUNNER_TEMP/engine-tests.log"
          flutter test --concurrency=1 --reporter expanded test/v56_ui_smoke_test.dart \
            --plain-name 'New users can open the create-account flow' \
            2>&1 | tee "$RUNNER_TEMP/signup-test.log"

      - name: Build and verify signed ARM64 review APK
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=BOTX_ENV=offline-demo \
            --dart-define=ALLOW_LIVE_MODE=false \
            2>&1 | tee "$RUNNER_TEMP/apk-build.log"
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.log"
          ! strings "$APK" | grep -Eq 'sk-[A-Za-z0-9]{16,}|gsk_[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{24,}|AKIA[0-9A-Z]{16}'
          cp "$APK" BotX_Pro_V56_ONEPASS_FINAL_ARM64_REVIEW.apk
          sha256sum BotX_Pro_V56_ONEPASS_FINAL_ARM64_REVIEW.apk > BotX_Pro_V56_ONEPASS_FINAL_ARM64_REVIEW.sha256

      - name: Upload APK and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botx-pro-v56-onepass-final-review-apk
          if-no-files-found: ignore
          retention-days: 30
          path: |
            app/BotX_Pro_V56_ONEPASS_FINAL_ARM64_REVIEW.apk
            app/BotX_Pro_V56_ONEPASS_FINAL_ARM64_REVIEW.sha256
            ${{ runner.temp }}/v56/onepass-changed-files.txt
            ${{ runner.temp }}/v56/themes-before.sha256
            ${{ runner.temp }}/pub-get.log
            ${{ runner.temp }}/format.log
            ${{ runner.temp }}/analyze.log
            ${{ runner.temp }}/logo-tests.log
            ${{ runner.temp }}/engine-tests.log
            ${{ runner.temp }}/signup-test.log
            ${{ runner.temp }}/apk-build.log
            ${{ runner.temp }}/apksigner.log
