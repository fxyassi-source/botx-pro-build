name: BotX Pro V56.0.3 Build5616 Minimal UI Final

on:
  pull_request:
    branches: [main]
    paths:
      - 'patches/build5616/minimal-ui-test-fix.patch.gz.b64'
      - '.github/workflows/release-android-build5616-minimal-ui-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v56-0-3-build5616-minimal-ui-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_RUN_ID: '30654353877'
      BASE_ARTIFACT: BotX-Pro-V56.0.3-Minimal-UI-Delivery-Build5616
      BASE_SOURCE_ZIP: BotXPro-V56.0.3-MinimalUI-Full-App-Source-Build5616.zip
      TEST_PATCH_B64_SHA256: 92561e0ec63bb7f6e5597543d3c2cfdcd7ea3dc3742bfe3aec1b8e717613c4b0
      TEST_PATCH_SHA256: a6efd93eb4df7056ac5b69d31e79cfc60f69bda16a4b0132789d0d234011f7ad
      SIGNING_TAG: botx-android-signing-v1

    steps:
      - name: Checkout exact PR state
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Restore latest minimal UI source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT }}
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}

      - name: Apply deterministic test-only correction
        run: |
          set -euo pipefail
          test -s "previous/${BASE_SOURCE_ZIP}"
          mkdir app extracted
          unzip -q "previous/${BASE_SOURCE_ZIP}" -d extracted
          APP_ROOT="$(dirname "$(find extracted -maxdepth 3 -name pubspec.yaml | head -n 1)")"
          test -n "${APP_ROOT}"
          cp -a "${APP_ROOT}/." app/

          find app/lib/core/theme -type f -print0 | sort -z \
            | xargs -0 sha256sum > theme-before.sha256
          sha256sum app/lib/app/v56_native_shell.dart > shell-before.sha256

          echo "${TEST_PATCH_B64_SHA256}  patches/build5616/minimal-ui-test-fix.patch.gz.b64" \
            | sha256sum --check --strict
          base64 -d patches/build5616/minimal-ui-test-fix.patch.gz.b64 \
            | gzip -dc > minimal-ui-test-fix.patch
          echo "${TEST_PATCH_SHA256}  minimal-ui-test-fix.patch" \
            | sha256sum --check --strict
          patch -p1 -d app < minimal-ui-test-fix.patch

          find app/lib/core/theme -type f -print0 | sort -z \
            | xargs -0 sha256sum > theme-after.sha256
          sha256sum app/lib/app/v56_native_shell.dart > shell-after.sha256
          diff -u theme-before.sha256 theme-after.sha256
          diff -u shell-before.sha256 shell-after.sha256

          grep -q '^version: 56.0.3+5616$' app/pubspec.yaml
          test ! -e app/lib/app/local_demo_engine.dart
          test ! -e app/test/local_demo_engine_test.dart
          test ! -e app/assets/v56/index.html
          grep -q 'Complete bot history' app/lib/app/v56_native_shell.dart
          grep -q "'LIVE BOT ENGINE'" app/lib/app/v56_native_shell.dart
          grep -q 'Kronos confirmation' app/lib/app/v56_native_shell.dart
          grep -q 'v56_market_chart' app/lib/app/v56_native_shell.dart

      - name: Restore persistent release signing identity
        run: |
          set -euo pipefail
          mkdir -p signing
          gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'botx-release.jks' --pattern 'botx-signing.env' \
            --dir signing --clobber
          source signing/botx-signing.env
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          cp signing/botx-release.jks app/android/app/botx-release.jks
          {
            echo "storeFile=botx-release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > app/android/key.properties

      - name: Resolve and format test correction
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          dart format test/v56_ui_smoke_test.dart

      - name: Validate seven locked UI contracts
        id: contracts
        run: |
          set -euo pipefail
          SHELL_FILE='app/lib/app/v56_native_shell.dart'
          TEST_FILE='app/test/v56_ui_smoke_test.dart'

          echo '1/7 One left-side Demo identity contract'
          grep -q 'v56_account_identity_detail' "${SHELL_FILE}"
          grep -q "startsWith('DEMO ·')" "${TEST_FILE}"

          echo '2/7 Rejected simulator wording absent'
          ! grep -R -n --fixed-strings 'BotX Pro Demo Simulator' app/lib app/assets

          echo '3/7 Portfolio width is targeted, not global'
          grep -q 'EdgeInsets.fromLTRB(14, 4, 14, 28)' "${SHELL_FILE}"
          grep -q 'portfolioRect.width, 362' "${TEST_FILE}"

          echo '4/7 Active and Stopped controls plus bot cards are compact'
          grep -q 'v56_bot_filter_active' "${SHELL_FILE}"
          grep -q 'height: 44' "${SHELL_FILE}"
          grep -q 'lessThan(210)' "${TEST_FILE}"

          echo '5/7 Slim XM-style navigation has one selected pill'
          grep -q 'v56_xm_navigation_bar' "${SHELL_FILE}"
          grep -q 'v56_selected_navigation_pill' "${SHELL_FILE}"

          echo '6/7 Settings use minimal individual cards'
          grep -q "id: 'brokers'" "${SHELL_FILE}"
          grep -q 'v56_settings_.*_card_' "${SHELL_FILE}"

          echo '7/7 Colours, production shell and compact overflow contract remain locked'
          diff -u theme-before.sha256 theme-after.sha256
          diff -u shell-before.sha256 shell-after.sha256
          grep -q 'Market chart and strategy studio avoid overflow on compact UI' \
            "${TEST_FILE}"

      - name: Analyze complete Flutter source
        id: analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../analyze-build5616-minimal-ui-final.log

      - name: Run complete non-visual Flutter release tests
        id: tests
        working-directory: app
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -type f -name '*_test.dart' \
            ! -name 'v56_visual_capture_test.dart' | sort)
          test "${#tests[@]}" -gt 0
          timeout 25m flutter test --concurrency=1 --reporter expanded \
            "${tests[@]}" 2>&1 | tee ../tests-build5616-minimal-ui-final.log

      - name: Build fresh signed release APK
        id: build
        working-directory: app
        run: |
          set -o pipefail
          timeout 35m flutter build apk --release \
            --build-name=56.0.3 --build-number=5616 \
            --dart-define=BOTX_ENV=release-candidate \
            --dart-define=ALLOW_LIVE_MODE=false 2>&1 \
            | tee ../build-release-5616-minimal-ui-final.log

      - name: Verify signature and package final delivery
        id: package
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist continuation
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          if test -s "${APK}"; then
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "${APKSIGNER}" verify --verbose --print-certs "${APK}" \
              | tee apk-signature-verification-5616-minimal-ui-final.txt
          fi

          if test -s "${APK}" \
            && test "${{ steps.contracts.outcome }}" = success \
            && test "${{ steps.analyze.outcome }}" = success \
            && test "${{ steps.tests.outcome }}" = success \
            && test "${{ steps.build.outcome }}" = success; then
            cp "${APK}" dist/BotXPro-V56.0.3-MinimalUI-Final-Build5616.apk
          fi

          rm -f app/android/app/botx-release.jks app/android/key.properties
          rm -rf app/build app/.dart_tool
          zip -qr dist/BotXPro-V56.0.3-MinimalUI-Final-Full-App-Source-Build5616.zip app

          cp patches/build5616/minimal-ui-fix.patch.gz.b64 continuation/
          cp patches/build5616/minimal-ui-test-fix.patch.gz.b64 continuation/
          cp minimal-ui-test-fix.patch continuation/
          cp .github/workflows/release-android-build5616-minimal-ui.yml continuation/
          cp .github/workflows/release-android-build5616-minimal-ui-final.yml continuation/
          cp theme-before.sha256 theme-after.sha256 continuation/
          cp shell-before.sha256 shell-after.sha256 continuation/
          cat > continuation/BOTX_PRO_BUILD5616_MINIMAL_UI_FINAL_HANDOFF.md <<EOF
          # BotX Pro V56.0.3 Build5616 — Minimal UI Final Handoff

          - Repository: ${GITHUB_REPOSITORY}
          - Pull Request: #24
          - Branch: ${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          - Workflow commit: ${GITHUB_SHA}
          - Final workflow run: ${GITHUB_RUN_ID}
          - Base minimal-UI source run: ${BASE_RUN_ID}
          - Flutter: 3.44.7
          - Colours/theme files: SHA-256 identical before and after the final correction
          - Production v56_native_shell.dart: SHA-256 identical before and after the final correction
          - Merge status: not merged by this workflow

          The approved colour-neutral Flutter UI changes are retained: one left-side Demo indication, rejected simulator wording absent, slightly wider Portfolio area, compact bot filters/cards, slim XM-style navigation, and minimal Settings cards. The final correction changed tests only to make compact navigation and off-screen Settings verification deterministic. Existing compact overflow, complete bot history, TradingView, Kronos, broker, risk, signing and server-authoritative contracts remain preserved.
          EOF
          zip -qr dist/BotXPro-V56.0.3-Build5616-Full-Stack-Continuation-Final.zip continuation

          cp analyze-build5616-minimal-ui-final.log \
            tests-build5616-minimal-ui-final.log \
            build-release-5616-minimal-ui-final.log \
            apk-signature-verification-5616-minimal-ui-final.txt \
            dist/ 2>/dev/null || true

          (cd dist && find . -maxdepth 1 -type f \
            \( -name '*.apk' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)

      - name: Upload final APK, source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-V56.0.3-Minimal-UI-Final-Delivery-Build5616
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce final release gates
        if: always()
        run: |
          test "${{ steps.contracts.outcome }}" = success
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.package.outcome }}" = success
          test -s dist/BotXPro-V56.0.3-MinimalUI-Final-Build5616.apk
          test -s dist/BotXPro-V56.0.3-MinimalUI-Final-Full-App-Source-Build5616.zip
          test -s dist/BotXPro-V56.0.3-Build5616-Full-Stack-Continuation-Final.zip
