name: BotX Pro V56 Elite Source Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-final-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINAL_SOURCE_FILE_ID: 1c6k4NLGqLtqCKO7BUWRPNoUBXz0MmA_y
      FINAL_SOURCE_SHA256: d4f805b07b6cf8b683c788e7f0070865f7827de9e3745dbe41375ed3ccab3129
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final reworked Flutter source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final-source" "$GITHUB_WORKSPACE/probe"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://drive.usercontent.google.com/download?id=${FINAL_SOURCE_FILE_ID}&export=download&confirm=t" \
            -o "$RUNNER_TEMP/final-source/mobile.tar.gz"
          file "$RUNNER_TEMP/final-source/mobile.tar.gz"
          ls -lh "$RUNNER_TEMP/final-source/mobile.tar.gz"
          echo "${FINAL_SOURCE_SHA256}  $RUNNER_TEMP/final-source/mobile.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/final-source/mobile.tar.gz" -C "$GITHUB_WORKSPACE/probe"
          grep -F 'version: 56.0.0+5600' "$GITHUB_WORKSPACE/probe/pubspec.yaml"
          grep -F "title: 'Sound & haptics'" "$GITHUB_WORKSPACE/probe/lib/app/v56_native_shell.dart"
          grep -F 'Color(0xFF0B241D)' "$GITHUB_WORKSPACE/probe/lib/core/theme/v56_theme.dart"
          grep -F 'Color(0xFF46E6B0)' "$GITHUB_WORKSPACE/probe/lib/core/theme/v56_theme.dart"
          ! grep -F "title: 'Backtesting'" "$GITHUB_WORKSPACE/probe/lib/app/v56_native_shell.dart"
