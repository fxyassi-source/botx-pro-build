name: BotX Pro V56 Logo Coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logo-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Confirm repository app source is absent
        run: test ! -d "$GITHUB_WORKSPACE/.git"

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Download SHA-locked V56 source and apply reconstruction patches
        shell: bash
        env:
          SOURCE_FILE_ID: 1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/app" "$RUNNER_TEMP/v56"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/v56_source.sha256" \
            --output "$RUNNER_TEMP/v56/expected.sha256"
          EXPECTED_SHA="$(tr -d '[:space:]' < "$RUNNER_TEMP/v56/expected.sha256")"
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t" \
            --output "$RUNNER_TEMP/v56/source.tar.gz"
          echo "${EXPECTED_SHA}  $RUNNER_TEMP/v56/source.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/v56/source.tar.gz" -C "$GITHUB_WORKSPACE/app"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/v56_patches/v56-reconstruction-mobile-fix.patch" \
            --output "$RUNNER_TEMP/v56/reconstruction.patch"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/v56_patches/v56-demo-certification-fix.patch" \
            --output "$RUNNER_TEMP/v56/demo-certification.patch"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/v56_patches/v56-logo-test-optimization-v6.patch" \
            --output "$RUNNER_TEMP/v56/logo-test-optimization.patch"
          echo "bd74e5546206dfd1c41ccf967c2ee5105a8ca9ebcfa53e3d88bbb4269b95b076  $RUNNER_TEMP/v56/demo-certification.patch" | sha256sum --check --strict
          echo "64013599e4f990c211b1e699b96708e438cabc30a7a981662d126db9960fc41a  $RUNNER_TEMP/v56/logo-test-optimization.patch" | sha256sum --check --strict
          cd "$GITHUB_WORKSPACE/app"
          patch --batch --forward -p1 < "$RUNNER_TEMP/v56/reconstruction.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/v56/demo-certification.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/v56/logo-test-optimization.patch"
          ! grep -RIn 'google.com/s2/favicons\|class _NetworkBrokerLogo' lib

      - name: Resolve logo dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze logo implementation
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos lib/app/market_identity_logo.dart test/market_identity_logo_test.dart \
            2>&1 | tee "$RUNNER_TEMP/v56-logo-analyze.log"

      - name: Validate bundled primary broker image dimensions
        working-directory: app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import struct

          source = Path('lib/app/market_identity_logo.dart').read_text(encoding='utf-8')
          marker = 'const _brokerAssets = <String, String>{'
          if marker not in source:
              raise SystemExit('broker asset map not found')
          block = source.split(marker, 1)[1].split('};', 1)[0]
          assets = sorted(set(re.findall(r"'[^']+'\s*:\s*'([^']+)'", block)))
          if not assets:
              raise SystemExit('no mapped broker assets')

          def dimensions(path: Path):
              data = path.read_bytes()
              if data.startswith(b'\x89PNG\r\n\x1a\n') and len(data) >= 24:
                  return struct.unpack('>II', data[16:24])
              if data.startswith(b'\xff\xd8'):
                  offset = 2
                  while offset + 8 < len(data):
                      while offset < len(data) and data[offset] != 0xFF:
                          offset += 1
                      while offset < len(data) and data[offset] == 0xFF:
                          offset += 1
                      if offset >= len(data):
                          break
                      marker_value = data[offset]
                      offset += 1
                      if marker_value in (0xD8, 0xD9):
                          continue
                      if offset + 1 >= len(data):
                          break
                      length = int.from_bytes(data[offset:offset + 2], 'big')
                      if length < 2 or offset + length > len(data):
                          break
                      if 0xC0 <= marker_value <= 0xCF and marker_value not in (0xC4, 0xC8, 0xCC):
                          height = int.from_bytes(data[offset + 3:offset + 5], 'big')
                          width = int.from_bytes(data[offset + 5:offset + 7], 'big')
                          return width, height
                      offset += length
              raise ValueError(f'unsupported or malformed image: {path}')

          for asset in assets:
              path = Path(asset)
              if not path.is_file():
                  raise SystemExit(f'missing mapped broker asset: {asset}')
              width, height = dimensions(path)
              if width < 96 or height < 96:
                  raise SystemExit(f'broker asset below 96x96: {asset} = {width}x{height}')
          print(f'Validated {len(assets)} unique mapped broker assets at >=96x96.')
          PY

      - name: Validate 204 contracts, renderer families and 53 broker logos
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter test --concurrency=1 --reporter expanded test/market_identity_logo_test.dart \
            2>&1 | tee "$RUNNER_TEMP/v56-logo-test.log"

      - name: Upload exact logo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v56-logo-test-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/v56-logo-analyze.log
            ${{ runner.temp }}/v56-logo-test.log
