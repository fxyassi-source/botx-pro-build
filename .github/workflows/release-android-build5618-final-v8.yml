name: BotX Pro Build5618 Compact Stage Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-android-build5618-final-v8.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: botx-build5618-compact-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_RUN_ID: '30674277528'
      BASE_ARTIFACT: BotX-Pro-V56.0.3-Guest-Preview-Delivery-Build5617
      BASE_SOURCE_ZIP: BotXPro-V56.0.3-GuestPreview-Full-App-Source-Build5617.zip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT }}
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
      - name: Reconstruct current Build5618
        run: |
          set -euo pipefail
          mkdir app extracted
          unzip -q "previous/${BASE_SOURCE_ZIP}" -d extracted
          ROOT="$(dirname "$(find extracted -maxdepth 4 -name pubspec.yaml | head -1)")"
          cp -a "$ROOT/." app/
          cat patches/build5618/part*.b64 | base64 -d | gzip -dc > base.patch
          patch -p1 -d app < base.patch
          base64 -d patches/build5618/realfix.patch.gz.b64 | gzip -dc > realfix.patch
          patch -p1 -d app < realfix.patch
          base64 -d patches/build5618/selective-braces.patch.gz.b64 | gzip -dc > braces.patch
          patch -p1 -d app < braces.patch
          base64 -d patches/build5618/final-analyzer.patch.gz.b64 | gzip -dc > final.patch
          patch -p1 -d app < final.patch
      - name: Add stage diagnostics
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/v56_ui_smoke_test.dart')
          s=p.read_text()
          marker="""    expect(compactPair, findsOneWidget);
    final compactPairInkWell = tester.widget<InkWell>("""
          replacement="""    expect(compactPair, findsOneWidget);
    final beforeRouteError = tester.takeException();
    // ignore: avoid_print
    print('BEFORE_ROUTE_ERROR=$beforeRouteError');
    if (beforeRouteError != null) debugDumpRenderTree();
    expect(beforeRouteError, isNull);
    final compactPairInkWell = tester.widget<InkWell>("""
          assert marker in s
          s=s.replace(marker,replacement,1)
          marker2="""    expect(tester.getSize(chart).width, 320);
    expect(tester.takeException(), isNull);

    await tester.tap(find.byTooltip('Back'));"""
          replacement2="""    expect(tester.getSize(chart).width, 320);
    final afterRouteError = tester.takeException();
    // ignore: avoid_print
    print('AFTER_ROUTE_ERROR=$afterRouteError');
    if (afterRouteError != null) debugDumpRenderTree();
    expect(afterRouteError, isNull);

    await tester.tap(find.byTooltip('Back'));"""
          assert marker2 in s
          p.write_text(s.replace(marker2,replacement2,1))
          PY
          flutter pub get
          dart format test/v56_ui_smoke_test.dart lib/app/v56_native_shell.dart lib/core/paper/local_paper_engine.dart
      - name: Run compact stage diagnostic
        working-directory: app
        run: |
          flutter test --concurrency=1 --reporter expanded \
            --plain-name 'Market chart and strategy studio avoid overflow on compact UI' \
            test/v56_ui_smoke_test.dart
