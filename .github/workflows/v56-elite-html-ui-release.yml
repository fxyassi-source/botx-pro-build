name: BotX Pro V56 Elite Exact Source Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v56-elite-exact-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FINAL_SOURCE_FILE_ID: 1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08
      FINAL_SOURCE_SHA256: d4f805b07b6cf8b683c788e7f0070865f7827de9e3745dbe41375ed3ccab3129
      UI_AUTHORITY_SHA256: 210647bdc447a55072fe16b6c7d348c7a316a0e0099c07c965f448dbf24112bd

    steps:
      - name: 1. Checkout build authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: 4. Download exact latest V56 Elite source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v56" "$GITHUB_WORKSPACE/app"
          curl --fail --location --retry 6 --retry-delay 3 \
            "https://drive.usercontent.google.com/download?id=${FINAL_SOURCE_FILE_ID}&export=download&confirm=t" \
            -o "$RUNNER_TEMP/v56/final-source.tar.gz"
          echo "${FINAL_SOURCE_SHA256}  $RUNNER_TEMP/v56/final-source.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/v56/final-source.tar.gz" -C "$GITHUB_WORKSPACE/app"

      - name: 5. Reject every old-UI fallback
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          grep -F 'version: 56.0.0+5600' pubspec.yaml
          grep -F 'namespace = "pro.botx.app"' android/app/build.gradle.kts
          grep -F 'class V56NativeShell' lib/app/v56_native_shell.dart
          grep -F "title: 'Sound & haptics'" lib/app/v56_native_shell.dart
          grep -F "title: 'App sounds'" lib/app/v56_native_shell.dart
          grep -F "title: 'Haptic feedback'" lib/app/v56_native_shell.dart
          grep -F 'Tap a market pair to open its chart and AI analysis.' lib/app/v56_native_shell.dart
          grep -F 'class _BotDeploymentConfigScreen' lib/app/v56_native_shell.dart
          grep -F "labelText: 'Currency pair / market'" lib/app/v56_native_shell.dart
          grep -F "labelText: 'Max positions'" lib/app/v56_native_shell.dart
          grep -F "labelText: 'Timeframe'" lib/app/v56_native_shell.dart
          grep -F "'Review & deploy bot'" lib/app/v56_native_shell.dart
          grep -F 'deployment configuration is stored and new bots append in creation order' test/local_demo_engine_test.dart
          grep -F 'Color(0xFF0B241D)' lib/core/theme/v56_theme.dart
          grep -F 'Color(0xFF46E6B0)' lib/core/theme/v56_theme.dart
          ! grep -F "title: 'Backtesting'" lib/app/v56_native_shell.dart
          ! grep -RIn 'webview_flutter\|flutter_html' pubspec.yaml
          ! grep -RIn 'google.com/s2/favicons\|class _NetworkBrokerLogo' lib
          cat > BotX_Pro_V56_Elite_Source_Lock.txt <<EOF
          Source file ID: ${FINAL_SOURCE_FILE_ID}
          Source SHA-256: ${FINAL_SOURCE_SHA256}
          V56 Gold HTML authority SHA-256: ${UI_AUTHORITY_SHA256}
          Version: 56.0.0+5600
          Package: pro.botx.app
          Live mode: disabled
          Old UI fallback: prohibited by build gates
          EOF

      - name: 6. Apply exact analyzer cleanup
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/v56_elite_analyze_cleanup.py"
          ! grep -RIn 'double _riskFraction\|String _brokerMark' lib/app

      - name: 7. Configure memory and RC signing
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle.properties')
          rows = path.read_text().splitlines() if path.exists() else []
          replacements = {
              'org.gradle.jvmargs=': 'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=256m -Xss512k -XX:+UseG1GC -Dfile.encoding=UTF-8',
              'org.gradle.workers.max=': 'org.gradle.workers.max=1',
              'kotlin.daemon.jvmargs=': 'kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Xss512k',
          }
          result, seen = [], set()
          for row in rows:
              prefix = next((p for p in replacements if row.startswith(p)), None)
              if prefix:
                  if prefix not in seen:
                      result.append(replacements[prefix]); seen.add(prefix)
              else:
                  result.append(row)
          for prefix, value in replacements.items():
              if prefix not in seen:
                  result.append(value)
          path.write_text('\n'.join(result) + '\n')
          PY
          keytool -genkeypair -keystore android/app/v56-elite-exact-rc.jks \
            -storepass changeit-v56-elite-exact -keypass changeit-v56-elite-exact -alias v56eliteexact \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=BotX Pro V56 Elite Exact RC, OU=Testing, O=BotX AI, L=Faridabad, ST=Haryana, C=IN"
          cat > android/key.properties <<'EOF'
          storePassword=changeit-v56-elite-exact
          keyPassword=changeit-v56-elite-exact
          keyAlias=v56eliteexact
          storeFile=v56-elite-exact-rc.jks
          EOF

      - name: 8. Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: 9. Strict Flutter analyze
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"

      - name: 10. Run UI, bot, market and chart regression tests
        working-directory: app
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/flutter-regression.log"
          for test_file in \
            test/v56_ui_smoke_test.dart \
            test/local_demo_engine_test.dart \
            test/market_identity_logo_test.dart \
            test/chart_datafeed_contract_test.dart; do
            echo "=== ${test_file} ===" | tee -a "$RUNNER_TEMP/flutter-regression.log"
            timeout 360s flutter test --concurrency=1 --reporter expanded "$test_file" \
              2>&1 | tee -a "$RUNNER_TEMP/flutter-regression.log"
          done

      - name: 11. Capture seven V56 verification screenshots
        working-directory: app
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test/goldens/generated
          mkdir -p test/goldens/generated
          flutter test --update-goldens test/v56_visual_capture_test.dart \
            2>&1 | tee "$RUNNER_TEMP/flutter-visual.log"
          test "$(find test/goldens/generated -name '*.png' | wc -l)" -eq 7

      - name: 12. Build signed ARM64 APK
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=ALLOW_LIVE_MODE=false \
            2>&1 | tee "$RUNNER_TEMP/flutter-apk.log"

      - name: 13. Build Android App Bundle
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release --dart-define=ALLOW_LIVE_MODE=false \
            2>&1 | tee "$RUNNER_TEMP/flutter-aab.log"

      - name: 14. Verify signing, secrets and hashes
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.log"
          ! strings "$APK" | grep -Eq 'sk-[A-Za-z0-9]{16,}|gsk_[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{24,}'
          cp "$APK" BotX_Pro_V56_Elite_Exact_UI_ARM64_RC.apk
          cp "$AAB" BotX_Pro_V56_Elite_Exact_UI_RC.aab
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --exclude='./build' --exclude='./.dart_tool' --exclude='./android/app/*.jks' \
            --exclude='./android/key.properties' \
            -czf "$RUNNER_TEMP/BotX_Pro_V56_Elite_Exact_UI_SOURCE_BUILD_CLEAN.tar.gz" .
          sha256sum BotX_Pro_V56_Elite_Exact_UI_ARM64_RC.apk \
            BotX_Pro_V56_Elite_Exact_UI_RC.aab \
            BotX_Pro_V56_Elite_Source_Lock.txt \
            "$RUNNER_TEMP/BotX_Pro_V56_Elite_Exact_UI_SOURCE_BUILD_CLEAN.tar.gz" \
            | tee BotX_Pro_V56_Elite_Exact_UI_SHA256SUMS.txt

      - name: 15. Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botx-pro-v56-elite-exact-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/flutter-analyze.log
            ${{ runner.temp }}/flutter-regression.log
            ${{ runner.temp }}/flutter-visual.log
            ${{ runner.temp }}/flutter-apk.log
            ${{ runner.temp }}/flutter-aab.log
            ${{ runner.temp }}/apksigner.log

      - name: 16. Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: botx-pro-v56-elite-exact-screenshots
          retention-days: 14
          path: app/test/goldens/generated/*.png

      - name: 17. Upload exact Android release and source lock
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: botx-pro-v56-elite-exact-android
          retention-days: 14
          path: |
            app/BotX_Pro_V56_Elite_Exact_UI_ARM64_RC.apk
            app/BotX_Pro_V56_Elite_Exact_UI_RC.aab
            app/BotX_Pro_V56_Elite_Exact_UI_SHA256SUMS.txt
            app/BotX_Pro_V56_Elite_Source_Lock.txt
            ${{ runner.temp }}/v56/final-source.tar.gz
            ${{ runner.temp }}/BotX_Pro_V56_Elite_Exact_UI_SOURCE_BUILD_CLEAN.tar.gz
