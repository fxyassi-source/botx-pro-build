name: BotX Pro V56.0.3 Kronos Edge-to-Edge APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'release-trigger/v56-0-3-kronos-edge-to-edge.txt'
      - 'patches/BOTX_PRO_V56_0_3_KRONOS_EDGE_UPGRADE.patch'
      - '.github/workflows/release-android-v56-0-3-kronos.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v56-0-3-kronos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_FILE_ID: 1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08
      SOURCE_SHA256: 4959b825a3aa7758513f97e647778ac594596d447131ba17fc600b7dbee01f93
      TARGET8_PATCH_SHA256: 659eef1211a2847af09a8e58c493f7de8a00b6534be6f1aac89fa5097b1209b8
      EDGE_PATCH_SHA256: 8bc323faadb1cee61685f024cd8ff4937c52aa845c41219a7b27cde71a5217e5
      TEST_ISOLATION_SHA256: ae1c6b2bb3fb13ae9b12fcc53a1c109999ec31821fc9962a0c3d81483bebe865
      FINAL_GATE_FIX_SHA256: f8404cc00fe967affd95c130e23b5e8baa7328685f6b6a9836bae248ba91e7ae
      TEST_PROCESS_ISOLATION_SHA256: 5eb8f6565c07da67de436de504cc54232771e45facdd5e151cd73591b2b19893
      KRONOS_EDGE_PATCH_SHA256: 35ec47b272bd5fefe96113be5dda0ececebd55635e087d690a846166a2ff69d0
      SIGNING_TAG: botx-android-signing-v1

    steps:
      - name: Checkout isolated release branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Stage locked source and V56.0.3 upgrade
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output app.tgz \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t"
          echo "${SOURCE_SHA256}  app.tgz" | sha256sum --check --strict
          mkdir app
          tar -xzf app.tgz -C app

          base64 -d patches/BOTX_PRO_V56_0_2_TARGET8.patch.gz.b64 | gzip -dc > target8.patch
          echo "${TARGET8_PATCH_SHA256}  target8.patch" | sha256sum --check --strict
          patch -p1 -d app < target8.patch

          base64 -d patches/BOTX_PRO_V56_0_2_EDGE_TO_EDGE.patch.gz.b64 | gzip -dc > edge.patch
          echo "${EDGE_PATCH_SHA256}  edge.patch" | sha256sum --check --strict
          patch -p1 -d app < edge.patch

          echo "${TEST_ISOLATION_SHA256}  patches/BOTX_PRO_V56_0_2_CI_TEST_ISOLATION.patch" \
            | sha256sum --check --strict
          patch -p1 -d app < patches/BOTX_PRO_V56_0_2_CI_TEST_ISOLATION.patch

          echo "${FINAL_GATE_FIX_SHA256}  patches/BOTX_PRO_V56_0_2_FINAL_GATE_FIX.patch" \
            | sha256sum --check --strict
          patch -p1 -d app < patches/BOTX_PRO_V56_0_2_FINAL_GATE_FIX.patch

          echo "${TEST_PROCESS_ISOLATION_SHA256}  patches/BOTX_PRO_V56_0_2_TEST_PROCESS_ISOLATION.patch" \
            | sha256sum --check --strict
          patch -p1 -d app < patches/BOTX_PRO_V56_0_2_TEST_PROCESS_ISOLATION.patch

          grep -q '^version: 56.0.2+5602$' app/pubspec.yaml
          find app/lib -type f \
            ! -path 'app/lib/app/v16_app_controller.dart' \
            ! -path 'app/lib/app/v56_native_shell.dart' \
            -print0 | sort -z | xargs -0 -r sha256sum > protected-lib.sha256

          echo "${KRONOS_EDGE_PATCH_SHA256}  patches/BOTX_PRO_V56_0_3_KRONOS_EDGE_UPGRADE.patch" \
            | sha256sum --check --strict
          patch -p1 -d app < patches/BOTX_PRO_V56_0_3_KRONOS_EDGE_UPGRADE.patch

          sha256sum --check --strict protected-lib.sha256
          grep -q '^version: 56.0.3+5614$' app/pubspec.yaml
          echo 'ea9286ad0af3664726a9de34e9629a856918bb95a8ab7204e621f3c9557c9c2c  app/lib/core/theme/botx_palette.dart' | sha256sum --check --strict
          echo 'f76500eb548d53f2e90141574e69b60c85090f8da9820e3d03c95ecbb184dcf7  app/lib/core/theme/v56_theme.dart' | sha256sum --check --strict
          echo '834e0cd63298d9db8c9150cc15eb98da15ab408b71b165043f92ebc574568c8f  app/lib/core/theme/v56_theme_contract.dart' | sha256sum --check --strict

      - name: Restore persistent release signing identity
        run: |
          set -euo pipefail
          mkdir -p signing
          gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'botx-release.jks' \
            --pattern 'botx-signing.env' \
            --dir signing --clobber
          source signing/botx-signing.env
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          cp signing/botx-release.jks app/android/app/botx-release.jks
          {
            echo "storeFile=botx-release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > app/android/key.properties

      - name: Resolve and format release source
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/app/v16_app_controller.dart \
            lib/app/v56_native_shell.dart \
            lib/core/models/kronos_models.dart \
            lib/features/intelligence/kronos_controller.dart \
            test/kronos_contract_test.dart \
            test/v56_ui_smoke_test.dart

      - name: Analyze complete Flutter source
        id: analyze
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log

      - name: Run focused complete release gate
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          set -o pipefail
          : > ../tests.log

          timeout 8m flutter test --concurrency=1 --reporter expanded \
            test/kronos_contract_test.dart \
            test/trading_view_widget_contract_test.dart \
            test/v56_demo_setup_flow_test.dart 2>&1 | tee -a ../tests.log

          mapfile -t regression_tests < <(
            find test -maxdepth 1 -type f -name '*_test.dart' \
              ! -name 'kronos_contract_test.dart' \
              ! -name 'trading_view_widget_contract_test.dart' \
              ! -name 'v56_demo_setup_flow_test.dart' \
              ! -name 'v56_ui_smoke_test.dart' \
              ! -name 'v56_visual_capture_test.dart' \
              | sort
          )
          timeout 12m flutter test --concurrency=1 --reporter expanded \
            "${regression_tests[@]}" 2>&1 | tee -a ../tests.log

          timeout 12m flutter test --concurrency=1 --reporter expanded \
            --name 'Market pair opens the full scrollable TradingView screen|Market chart and strategy studio avoid overflow on compact UI|Market chart remains full-width on a large Android viewport|Dashboard theme button cycles all eight locked modes|Bot selector keeps the four named bots and removes row Start buttons|Deploy Your Strategies opens the Ask AI full-screen route' \
            test/v56_ui_smoke_test.dart 2>&1 | tee -a ../tests.log

          grep -q 'Kronos confirmation' lib/app/v56_native_shell.dart
          grep -q 'Kronos forecast range' lib/app/v56_native_shell.dart
          grep -q 'Forecast provider' lib/app/v56_native_shell.dart
          grep -q 'v56_market_chart' lib/app/v56_native_shell.dart
          grep -q 'v56_custom_bot_edge_to_edge' lib/app/v56_native_shell.dart
          grep -q 'v56_deploy_your_strategies' lib/app/v56_native_shell.dart
          grep -q 'extendBodyBehindAppBar: false' lib/app/v56_native_shell.dart
          grep -q '"hide_side_toolbar":false' test/trading_view_widget_contract_test.dart
          test "$(grep -c 'Chart by TradingView' lib/features/market/trading_view_chart.dart)" -eq 1

      - name: Build signed release APK
        id: build
        if: steps.analyze.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          timeout 30m flutter build apk --release \
            --build-name=56.0.3 --build-number=5614 \
            --dart-define=BOTX_ENV=release-candidate \
            --dart-define=ALLOW_LIVE_MODE=false 2>&1 | tee ../build-release.log

      - name: Verify and package delivery
        id: package
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          if test -s "${APK}"; then
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "${APKSIGNER}" verify --verbose --print-certs "${APK}" \
              | tee apk-signature-verification.txt
          fi
          if test -s "${APK}" \
            && test "${{ steps.analyze.outcome }}" = success \
            && test "${{ steps.tests.outcome }}" = success \
            && test "${{ steps.build.outcome }}" = success; then
            cp "${APK}" dist/BotXPro-V56.0.3-Kronos-EdgeToEdge-Build5614.apk
          fi
          {
            echo '# BotX Pro V56.0.3 Kronos Edge-to-Edge Release'
            echo '- Android build code: 5614'
            echo '- Flutter analyze: ${{ steps.analyze.outcome }}'
            echo '- Focused complete tests: ${{ steps.tests.outcome }}'
            echo '- Signed APK build: ${{ steps.build.outcome }}'
            echo '- Kronos role: capped forecast/confirmation only'
            echo '- BotX risk engine: final execution authority'
            echo '- TradingView branding: preserved once'
            echo '- Eight locked themes: unchanged'
          } > app/V56_0_3_RELEASE_VALIDATION_REPORT.md
          rm -f app/android/app/botx-release.jks app/android/key.properties
          zip -qr dist/BotXPro-V56.0.3-Kronos-EdgeToEdge-App-Source.zip app \
            -x 'app/build/*' 'app/.dart_tool/*' 'app/*.apk' 'app/*.aab'
          cp analyze.log tests.log build-release.log \
            apk-signature-verification.txt dist/ 2>/dev/null || true
          (cd dist && find . -maxdepth 1 -type f \
            \( -name '*.apk' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)

      - name: Upload signed APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-V56.0.3-Kronos-EdgeToEdge-Delivery-Build5614
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce release gates
        if: always()
        run: |
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.package.outcome }}" = success
          test -s dist/BotXPro-V56.0.3-Kronos-EdgeToEdge-Build5614.apk
