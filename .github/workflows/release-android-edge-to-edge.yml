name: BotX Pro V56.0.2 Edge-to-Edge APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'release-trigger/v56-0-2-edge-to-edge.txt'
      - 'patches/BOTX_PRO_V56_0_2_TARGET8.patch.gz.b64'
      - 'patches/BOTX_PRO_V56_0_2_EDGE_TO_EDGE.patch.gz.b64'
      - 'patches/BOTX_PRO_V56_0_2_CI_TEST_ISOLATION.patch'
      - 'patches/BOTX_PRO_V56_0_2_FINAL_GATE_FIX.patch'
      - 'patches/BOTX_PRO_V56_0_2_TEST_PROCESS_ISOLATION.patch'
      - '.github/workflows/release-android-edge-to-edge.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v56-edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  edge-to-edge-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_FILE_ID: 1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08
      SOURCE_SHA256: 4959b825a3aa7758513f97e647778ac594596d447131ba17fc600b7dbee01f93
      TARGET8_PATCH_SHA256: 659eef1211a2847af09a8e58c493f7de8a00b6534be6f1aac89fa5097b1209b8
      EDGE_PATCH_SHA256: 8bc323faadb1cee61685f024cd8ff4937c52aa845c41219a7b27cde71a5217e5
      TEST_ISOLATION_SHA256: ae1c6b2bb3fb13ae9b12fcc53a1c109999ec31821fc9962a0c3d81483bebe865
      FINAL_GATE_FIX_SHA256: f8404cc00fe967affd95c130e23b5e8baa7328685f6b6a9836bae248ba91e7ae
      TEST_PROCESS_ISOLATION_SHA256: e91ffebf7ae51a3c84bae36751da10161ba207ece0bb4e77ce3530e52c2576e2
      SIGNING_TAG: botx-android-signing-v1

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Stage locked source and apply isolated UI patches
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output app.tgz \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t"
          echo "${SOURCE_SHA256}  app.tgz" | sha256sum --check --strict
          mkdir app
          tar -xzf app.tgz -C app

          base64 -d patches/BOTX_PRO_V56_0_2_TARGET8.patch.gz.b64 | gzip -dc > target8.patch
          echo "${TARGET8_PATCH_SHA256}  target8.patch" | sha256sum --check --strict
          patch -p1 -d app < target8.patch

          find app/lib -type f \
            ! -path 'app/lib/app/v56_native_shell.dart' \
            ! -path 'app/lib/features/market/trading_view_chart.dart' \
            -print0 | sort -z | xargs -0 -r sha256sum > protected-lib.sha256

          base64 -d patches/BOTX_PRO_V56_0_2_EDGE_TO_EDGE.patch.gz.b64 | gzip -dc > edge-to-edge.patch
          echo "${EDGE_PATCH_SHA256}  edge-to-edge.patch" | sha256sum --check --strict
          patch -p1 -d app < edge-to-edge.patch

          echo "${TEST_ISOLATION_SHA256}  patches/BOTX_PRO_V56_0_2_CI_TEST_ISOLATION.patch" \
            | sha256sum --check --strict
          patch -p1 -d app < patches/BOTX_PRO_V56_0_2_CI_TEST_ISOLATION.patch

          echo "${FINAL_GATE_FIX_SHA256}  patches/BOTX_PRO_V56_0_2_FINAL_GATE_FIX.patch" \
            | sha256sum --check --strict
          patch -p1 -d app < patches/BOTX_PRO_V56_0_2_FINAL_GATE_FIX.patch

          echo "${TEST_PROCESS_ISOLATION_SHA256}  patches/BOTX_PRO_V56_0_2_TEST_PROCESS_ISOLATION.patch" \
            | sha256sum --check --strict
          patch -p1 -d app < patches/BOTX_PRO_V56_0_2_TEST_PROCESS_ISOLATION.patch

          sha256sum --check --strict protected-lib.sha256
          grep -q '^version: 56.0.2+5602$' app/pubspec.yaml

      - name: Restore persistent release signing identity
        run: |
          set -euo pipefail
          mkdir -p signing
          gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'botx-release.jks' \
            --pattern 'botx-signing.env' \
            --dir signing --clobber
          source signing/botx-signing.env
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          cp signing/botx-release.jks app/android/app/botx-release.jks
          {
            echo "storeFile=botx-release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > app/android/key.properties

      - name: Resolve and format patched mobile source
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/app/v56_native_shell.dart \
            lib/features/market/trading_view_chart.dart \
            test/v56_ui_smoke_test.dart \
            test/v56_demo_setup_flow_test.dart \
            test/v56_visual_capture_test.dart \
            test/trading_view_widget_contract_test.dart

      - name: Analyze complete Flutter source
        id: analyze
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log

      - name: Run complete Flutter test suite and targeted contracts
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          set -o pipefail

          timeout 5m flutter test \
            --concurrency=1 \
            --update-goldens \
            --reporter expanded \
            test/v56_visual_capture_test.dart 2>&1 | tee ../golden-baseline.log

          timeout 3m flutter test \
            --concurrency=1 \
            --reporter expanded \
            test/v56_demo_setup_flow_test.dart 2>&1 | tee ../demo-setup-flow.log

          timeout 15m flutter test \
            --concurrency=1 \
            --reporter expanded 2>&1 | tee ../tests.log

          grep -q 'v56_market_chart' lib/app/v56_native_shell.dart
          grep -q 'v56_custom_bot_edge_to_edge' lib/app/v56_native_shell.dart
          grep -q 'v56_deploy_your_strategies' lib/app/v56_native_shell.dart
          grep -q 'Deploy Your Strategies' lib/app/v56_native_shell.dart
          grep -q 'Market Analysis' lib/app/v56_native_shell.dart
          grep -q 'Candle pattern' lib/app/v56_native_shell.dart
          grep -q 'Support' lib/app/v56_native_shell.dart
          grep -q 'Resistance' lib/app/v56_native_shell.dart
          grep -q 'Market News' lib/app/v56_native_shell.dart
          grep -q '"hide_side_toolbar":false' test/trading_view_widget_contract_test.dart
          grep -q 'extendBodyBehindAppBar: false' lib/app/v56_native_shell.dart
          grep -q 'Guest V56 shell creates a demo account' test/v56_demo_setup_flow_test.dart
          grep -q 'Create My Own Bot.*findsNothing' test/v56_ui_smoke_test.dart
          test "$(grep -c 'Chart by TradingView' lib/features/market/trading_view_chart.dart)" -eq 1

      - name: Build signed release APK
        id: build
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          timeout 30m flutter build apk --release \
            --build-name=56.0.2 --build-number=5607 \
            --dart-define=BOTX_ENV=release-candidate \
            --dart-define=ALLOW_LIVE_MODE=false 2>&1 | tee ../build-release.log

      - name: Verify and package delivery
        id: package
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          if test -s "${APK}"; then
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee apk-signature-verification.txt
          fi
          if test -s "${APK}" \
            && test "${{ steps.analyze.outcome }}" = success \
            && test "${{ steps.tests.outcome }}" = success \
            && test "${{ steps.build.outcome }}" = success; then
            cp "${APK}" dist/BotXPro-V56.0.2-EdgeToEdge-Build5607.apk
          fi
          cat > app/EDGE_TO_EDGE_COMPLETION_REPORT.md <<EOF
          # BotX Pro V56.0.2 Edge-to-Edge UI Patch
          - Android build code: 5607
          - Analyze: ${{ steps.analyze.outcome }}
          - Complete Flutter tests: ${{ steps.tests.outcome }}
          - Signed APK build: ${{ steps.build.outcome }}
          - Visual baselines: refreshed for the approved UI changes and revalidated
          - Market/chart/feed callbacks: preserved
          - Bot/risk/execution source: unchanged by this patch
          - All existing theme source files: unchanged by this patch
          EOF
          rm -f app/android/app/botx-release.jks app/android/key.properties
          zip -qr dist/BotXPro-V56.0.2-EdgeToEdge-Source.zip app \
            -x 'app/build/*' 'app/.dart_tool/*' 'app/*.apk' 'app/*.aab'
          cp analyze.log golden-baseline.log demo-setup-flow.log tests.log \
            build-release.log apk-signature-verification.txt dist/ 2>/dev/null || true
          (cd dist && find . -maxdepth 1 -type f \
            \( -name '*.apk' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)

      - name: Upload signed APK and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-V56.0.2-EdgeToEdge-Delivery-Build5607
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce release gates
        if: always()
        run: |
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.package.outcome }}" = success
          test -s dist/BotXPro-V56.0.2-EdgeToEdge-Build5607.apk
