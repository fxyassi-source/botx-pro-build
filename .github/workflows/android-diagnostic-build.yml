name: Android Diagnostic Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Stage verified app
        run: |
          curl -fL --retry 5 -o app.tgz "https://drive.usercontent.google.com/download?id=1gIEZqbEYcq9fgMDblbQ8lS-MMnSAzlkt&export=download&confirm=t"
          echo "511bb612a157cdf03cf73d093dd158603b2d15dde16c2dad361ae3f96f3502a7  app.tgz" | sha256sum -c -
          mkdir app
          tar -xzf app.tgz -C app
      - name: Dependencies
        working-directory: app
        run: flutter pub get 2>&1 | tee ../pub-get.log
      - name: Analyze and capture
        id: analyze
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee ../analyze.log
      - name: Tests and capture
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../tests.log
      - name: Build debug APK and capture
        id: build
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ../build.log
      - name: Validate APK when present
        if: always()
        run: |
          APK="app/build/app/outputs/flutter-apk/app-debug.apk"
          if [ -s "$APK" ]; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            "$AAPT" dump badging "$APK" | tee apk-badging.txt
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-verification.txt
            sha256sum "$APK" | tee BotX_Pro_15_0_7_Debug_APK.sha256
            cp "$APK" BotX_Pro_Master_V14_15_0_7_Debug.apk
          else
            echo "APK not produced" | tee apk-not-produced.txt
          fi
      - name: Upload diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-15.0.7-Diagnostics-And-APK
          path: |
            pub-get.log
            analyze.log
            tests.log
            build.log
            apk-not-produced.txt
            BotX_Pro_Master_V14_15_0_7_Debug.apk
            BotX_Pro_15_0_7_Debug_APK.sha256
            apk-badging.txt
            apksigner-verification.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce final gates
        if: always()
        run: |
          test "${{ steps.analyze.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test -s BotX_Pro_Master_V14_15_0_7_Debug.apk
