name: Android Diagnostic Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.build-trigger/**'

permissions:
  contents: read

jobs:
  diagnose-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Stage verified patched app
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output app.tgz.b64 \
            "https://drive.usercontent.google.com/download?id=1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08&export=download&confirm=t"
          base64 --decode app.tgz.b64 > app.tgz
          echo "ee36c56bd986df95c8f80f2b258780ddd0537b05f7fa2679e355edb0c5a8022e  app.tgz" | sha256sum --check --strict
          mkdir -p app
          tar -xzf app.tgz -C app
          test -f app/pubspec.yaml
          test -f app/android/app/build.gradle.kts

      - name: Dependencies
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../pub-get.log

      - name: Analyze and capture
        id: analyze
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee ../analyze.log

      - name: Tests and capture
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../tests.log

      - name: Build debug APK and capture
        id: build
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ../build.log

      - name: Validate APK when present
        id: validate
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail
          APK="app/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='pro.botx.app' versionCode='1507' versionName='15.0.7'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-verification.txt
          sha256sum "$APK" | tee BotX_Pro_15_0_7_Debug_APK.sha256
          cp "$APK" BotX_Pro_Master_V14_15_0_7_Debug.apk

      - name: Record outcomes
        if: always()
        run: |
          {
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "validate=${{ steps.validate.outcome }}"
          } | tee gate-outcomes.txt

      - name: Upload diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-15.0.7-Diagnostics-And-APK
          path: |
            pub-get.log
            analyze.log
            tests.log
            build.log
            gate-outcomes.txt
            BotX_Pro_Master_V14_15_0_7_Debug.apk
            BotX_Pro_15_0_7_Debug_APK.sha256
            apk-badging.txt
            apksigner-verification.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Require valid installable APK
        if: always()
        run: |
          test -s BotX_Pro_Master_V14_15_0_7_Debug.apk
