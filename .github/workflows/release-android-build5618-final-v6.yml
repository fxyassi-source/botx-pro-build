name: BotX Pro V56.0.3 Build5618 Final V6

on:
  pull_request:
    branches: [main]
    paths:
      - 'patches/build5618/selective-braces.patch.gz.b64'
      - '.github/workflows/release-android-build5618-final-v6.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: botx-build5618-final-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_RUN_ID: '30674277528'
      BASE_ARTIFACT: BotX-Pro-V56.0.3-Guest-Preview-Delivery-Build5617
      BASE_SOURCE_ZIP: BotXPro-V56.0.3-GuestPreview-Full-App-Source-Build5617.zip
      BASE_B64_SHA: bed2258414736708b7f5ab25ff6f21005759dc949222bd7d0762e872bda65d1e
      BASE_PATCH_SHA: 4b9d262e79663ed1d8cc6538c0223093bf9281cbc3dcd4def68eb66fe2341bfa
      FIX_B64_SHA: 09de4239672b985dc70c7a4cd572d1d8ceb0fa3eff113ca2337e17cba2252b1b
      FIX_PATCH_SHA: 12dc78036bbeb612b72e3738f29904ef8d0768f0269256f61dd64ea420c9f76b
      BRACE_B64_SHA: 4fa2e5dadfec51835409bf10999908097f43fe6858c59c197b23269c2726ed7b
      BRACE_PATCH_SHA: 7a107c8ca55496041f14a94b948c551373f6319d27316070fb3ddc51a1703d0a
      APK_NAME: BotXPro-V56.0.3-V56Paper-Build5618.apk
      SOURCE_NAME: BotXPro-V56.0.3-V56Paper-Full-App-Source-Build5618.zip

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT }}
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}

      - name: Reconstruct exact source
        run: |
          set -euo pipefail
          mkdir app extracted
          unzip -q "previous/${BASE_SOURCE_ZIP}" -d extracted
          ROOT="$(dirname "$(find extracted -maxdepth 4 -name pubspec.yaml | head -1)")"
          test -n "$ROOT"
          cp -a "$ROOT/." app/
          find app/lib/core/theme -type f -print0 | sort -z | xargs -0 sha256sum > theme-before.sha256

          cat patches/build5618/part*.b64 > base.b64
          echo "${BASE_B64_SHA}  base.b64" | sha256sum -c --strict
          base64 -d base.b64 | gzip -dc > base.patch
          echo "${BASE_PATCH_SHA}  base.patch" | sha256sum -c --strict
          patch -p1 -d app < base.patch

          echo "${FIX_B64_SHA}  patches/build5618/realfix.patch.gz.b64" | sha256sum -c --strict
          base64 -d patches/build5618/realfix.patch.gz.b64 | gzip -dc > realfix.patch
          echo "${FIX_PATCH_SHA}  realfix.patch" | sha256sum -c --strict
          patch -p1 -d app < realfix.patch

          echo "${BRACE_B64_SHA}  patches/build5618/selective-braces.patch.gz.b64" | sha256sum -c --strict
          base64 -d patches/build5618/selective-braces.patch.gz.b64 | gzip -dc > braces.patch
          echo "${BRACE_PATCH_SHA}  braces.patch" | sha256sum -c --strict
          patch -p1 -d app < braces.patch

          grep -q '^version: 56.0.3+5618$' app/pubspec.yaml
          test ! -e app/lib/app/local_demo_engine.dart
          test ! -e app/test/local_demo_engine_test.dart
          test ! -e app/assets/v56/index.html

      - name: Restore release signing
        run: |
          set -euo pipefail
          mkdir signing
          gh release download botx-android-signing-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern botx-release.jks --pattern botx-signing.env --dir signing --clobber
          source signing/botx-signing.env
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          cp signing/botx-release.jks app/android/app/botx-release.jks
          printf 'storeFile=botx-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/android/key.properties

      - name: Format and lock checks
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/app/botx_app.dart lib/app/v16_app_controller.dart \
            lib/app/v56_native_shell.dart lib/core/paper/local_paper_engine.dart \
            test/local_paper_engine_test.dart test/support/v56_server_snapshot_fixture.dart \
            test/v56_demo_setup_flow_test.dart test/v56_ui_smoke_test.dart
          cd ..
          find app/lib/core/theme -type f -print0 | sort -z | xargs -0 sha256sum > theme-after.sha256
          diff -u theme-before.sha256 theme-after.sha256
          grep -q "'Demo account'" app/lib/app/v56_native_shell.dart
          grep -q "'#BOTX-DEMO'" app/lib/app/v56_native_shell.dart
          grep -q 'height: 190' app/lib/app/v56_native_shell.dart
          grep -q 'screenHeight < 700' app/lib/app/v56_native_shell.dart
          grep -q 'class _FlatOrderTab' app/lib/app/v56_native_shell.dart
          grep -q 'class _SettingsGroup' app/lib/app/v56_native_shell.dart
          grep -q 'class _V56GlobalFeedbackBoundary' app/lib/app/v56_native_shell.dart
          grep -q 'PUBLIC_DELAYED' app/lib/core/paper/local_paper_engine.dart
          grep -q 'query1.finance.yahoo.com' app/lib/core/paper/local_paper_engine.dart
          test -s app/lib/core/models/kronos_models.dart
          test -s app/lib/features/intelligence/kronos_controller.dart
          ! grep -R -n --fixed-strings 'BotX Pro Demo Simulator' app/lib app/assets

      - name: Flutter analyze zero issues
        id: analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../analyze-build5618.log

      - name: Complete non-visual Flutter tests
        id: tests
        working-directory: app
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find test -type f -name '*_test.dart' ! -name 'v56_visual_capture_test.dart' | sort)
          test "${#TESTS[@]}" -gt 0
          timeout 30m flutter test --concurrency=1 --reporter expanded "${TESTS[@]}" 2>&1 | tee ../tests-build5618.log

      - name: Build signed release APK
        id: build
        working-directory: app
        run: |
          set -o pipefail
          timeout 40m flutter build apk --release \
            --build-name=56.0.3 --build-number=5618 \
            --dart-define=BOTX_ENV=release-candidate \
            --dart-define=ALLOW_LIVE_MODE=false 2>&1 | tee ../build-build5618.log

      - name: Verify and package
        id: package
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner-build5618.log
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner-build5618.log
          mkdir delivery
          cp "$APK" "delivery/${APK_NAME}"
          rm -f app/android/app/botx-release.jks app/android/key.properties
          rm -rf app/build app/.dart_tool app/android/.gradle
          ! find app -type f \( -name '*.jks' -o -name '*.keystore' -o -name key.properties \) | grep .
          (cd app && zip -qr "../delivery/${SOURCE_NAME}" . -x '.git/*' 'build/*' '.dart_tool/*' 'android/.gradle/*')
          cp analyze-build5618.log tests-build5618.log build-build5618.log apksigner-build5618.log delivery/
          cp theme-before.sha256 theme-after.sha256 base.patch realfix.patch braces.patch delivery/
          cat > delivery/BUILD5618_RELEASE_REPORT.md <<'EOF'
          # BotX Pro V56.0.3 Build5618
          Approved V56 v5 Portfolio/Home, flat Settings and Orders, exact 190 px active bot cards, Terminal theme-token correction and global sound/haptics are implemented.
          Compact chart geometry is restrained only below 700 px screen height; normal approved geometry remains unchanged.
          Paper mode uses attributed public delayed quotes, persistent virtual funds and bounded BotX-compatible strategy/risk rules. It is not broker execution or real-money trading.
          Theme source files are byte-identical. ALLOW_LIVE_MODE=false.
          EOF
          (cd delivery && sha256sum * > SHA256SUMS.txt)
          unzip -tq "delivery/${SOURCE_NAME}"
          unzip -tq "delivery/${APK_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-V56.0.3-Paper-V56-Delivery-Build5618
          path: delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enforce all gates
        if: always()
        run: |
          set -euo pipefail
          test '${{ steps.analyze.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.package.outcome }}' = success
