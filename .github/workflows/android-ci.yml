name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Stage app
        run: |
          curl -fL --retry 5 -o app.tgz "https://drive.usercontent.google.com/download?id=1gIEZqbEYcq9fgMDblbQ8lS-MMnSAzlkt&export=download&confirm=t"
          echo "511bb612a157cdf03cf73d093dd158603b2d15dde16c2dad361ae3f96f3502a7  app.tgz" | sha256sum -c -
          mkdir app
          tar -xzf app.tgz -C app
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build APK
        working-directory: app
        run: flutter build apk --debug
      - name: Verify APK
        run: |
          APK=app/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='pro.botx.app' versionCode='1507' versionName='15.0.7'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-verification.txt
          sha256sum "$APK" | tee BotX_Pro_15_0_7_Debug_APK.sha256
          cp "$APK" BotX_Pro_Master_V14_15_0_7_Debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-Master-V14-15.0.7-Debug-APK
          path: |
            BotX_Pro_Master_V14_15_0_7_Debug.apk
            BotX_Pro_15_0_7_Debug_APK.sha256
            apk-badging.txt
            apksigner-verification.txt
          if-no-files-found: error
          retention-days: 14
