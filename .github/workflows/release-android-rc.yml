name: BotX Pro Android Release Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'release-trigger/**'
      - '.github/workflows/release-android-rc.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_FILE_ID: 1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08
      SOURCE_SHA256: d1798e0a0926f0e1656790c3b456cd640cac6397f91f607e0c0a1228146ebbc0
      SIGNING_TAG: botx-android-signing-v1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Stage verified release source
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output app.tgz \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t"
          echo "${SOURCE_SHA256}  app.tgz" | sha256sum --check --strict
          mkdir app
          tar -xzf app.tgz -C app
          test -f app/pubspec.yaml
          test -f app/android/app/build.gradle.kts
          test -f app/lib/features/auth/auth_gate.dart
          ! grep -R -E 'webview_flutter|InAppWebView|WebViewWidget|loadHtmlString' app/lib app/pubspec.yaml

      - name: Restore or create persistent Android release signing identity
        run: |
          set -euo pipefail
          mkdir -p signing
          if gh release view "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern 'botx-release.jks' \
              --pattern 'botx-signing.env' \
              --dir signing --clobber
          else
            STORE_PASSWORD="$(openssl rand -hex 32)"
            KEY_PASSWORD="$(openssl rand -hex 32)"
            keytool -genkeypair -v \
              -keystore signing/botx-release.jks \
              -storetype JKS \
              -storepass "${STORE_PASSWORD}" \
              -alias botxpro \
              -keypass "${KEY_PASSWORD}" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 9125 \
              -dname 'CN=BotX Pro, OU=Android Release, O=BotX AI Innovation, L=Faridabad, ST=Haryana, C=IN'
            {
              echo "STORE_PASSWORD=${STORE_PASSWORD}"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
              echo 'KEY_ALIAS=botxpro'
            } > signing/botx-signing.env
            chmod 600 signing/botx-release.jks signing/botx-signing.env
            gh release create "${SIGNING_TAG}" \
              signing/botx-release.jks signing/botx-signing.env \
              --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title 'BotX Pro Android Signing Identity v1' \
              --notes 'Private persistent Android release signing identity. Never publish or delete unless rotating the application signing key.'
          fi
          source signing/botx-signing.env
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          cp signing/botx-release.jks app/android/app/botx-release.jks
          cat > app/android/key.properties <<EOF
          storeFile=botx-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          keytool -list -v -keystore signing/botx-release.jks -storepass "${STORE_PASSWORD}" -alias "${KEY_ALIAS}" \
            | grep -E 'Alias name:|Owner:|SHA256:' > signing-certificate-summary.txt

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze release source
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Build signed release APKs and AAB
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --build-name=15.0.7 --build-number=1508 \
            --dart-define=BOTX_ENV=release-candidate
          flutter build appbundle --release \
            --build-name=15.0.7 --build-number=1508 \
            --dart-define=BOTX_ENV=release-candidate

      - name: Validate identity, release signature and package metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          ARM64='app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          ARMV7='app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk'
          X64='app/build/app/outputs/flutter-apk/app-x86_64-release.apk'
          AAB='app/build/app/outputs/bundle/release/app-release.aab'
          test -s "${ARM64}"
          test -s "${ARMV7}"
          test -s "${X64}"
          test -s "${AAB}"
          cp "${ARM64}" dist/BotX_Pro_Master_V14_15_0_7_RC1508_ARM64_Release.apk
          cp "${ARMV7}" dist/BotX_Pro_Master_V14_15_0_7_RC1508_ARMv7_Release.apk
          cp "${X64}" dist/BotX_Pro_Master_V14_15_0_7_RC1508_x86_64_Release.apk
          cp "${AAB}" dist/BotX_Pro_Master_V14_15_0_7_RC1508_Release.aab
          cp signing-certificate-summary.txt dist/
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "${AAPT}" dump badging "${ARM64}" | tee dist/apk-badging-arm64.txt
          # Flutter split-per-abi adds the ARM64 ABI offset (2000) to base build 1508.
          grep -q "package: name='pro.botx.app' versionCode='3508' versionName='15.0.7'" dist/apk-badging-arm64.txt
          "${APKSIGNER}" verify --verbose --print-certs "${ARM64}" | tee dist/apksigner-arm64.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/apksigner-arm64.txt
          sha256sum dist/*.apk dist/*.aab | tee dist/SHA256SUMS.txt
          tar -czf dist/BotX_Pro_Android_Signing_Backup_v1.tar.gz -C signing botx-release.jks botx-signing.env
          sha256sum dist/BotX_Pro_Android_Signing_Backup_v1.tar.gz > dist/BotX_Pro_Android_Signing_Backup_v1.sha256

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-15.0.7-RC1508-Signed-Release
          path: |
            dist/BotX_Pro_Master_V14_15_0_7_RC1508_ARM64_Release.apk
            dist/BotX_Pro_Master_V14_15_0_7_RC1508_ARMv7_Release.apk
            dist/BotX_Pro_Master_V14_15_0_7_RC1508_x86_64_Release.apk
            dist/BotX_Pro_Master_V14_15_0_7_RC1508_Release.aab
            dist/SHA256SUMS.txt
            dist/apk-badging-arm64.txt
            dist/apksigner-arm64.txt
            dist/signing-certificate-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload private signing backup
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-Android-Signing-Backup-v1
          path: |
            dist/BotX_Pro_Android_Signing_Backup_v1.tar.gz
            dist/BotX_Pro_Android_Signing_Backup_v1.sha256
          if-no-files-found: error
          retention-days: 90
