name: BotX Pro V56.0.2 Target-8 Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'release-trigger/**'
      - 'patches/BOTX_PRO_V56_0_2_TARGET8.patch.gz.b64'
      - '.github/workflows/release-android-rc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  target8-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_FILE_ID: 1CpzzVCoTWhvo67LZ5fEty_UruvDzsy08
      SOURCE_SHA256: 4959b825a3aa7758513f97e647778ac594596d447131ba17fc600b7dbee01f93
      PATCH_SHA256: 659eef1211a2847af09a8e58c493f7de8a00b6534be6f1aac89fa5097b1209b8
      SIGNING_TAG: botx-android-signing-v1

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Stage locked V56.0.1 source and apply Target-8 patch
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output app.tgz \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t"
          echo "${SOURCE_SHA256}  app.tgz" | sha256sum --check --strict
          mkdir app
          tar -xzf app.tgz -C app
          base64 -d patches/BOTX_PRO_V56_0_2_TARGET8.patch.gz.b64 | gzip -dc > target8.patch
          echo "${PATCH_SHA256}  target8.patch" | sha256sum --check --strict
          patch -p1 -d app < target8.patch
          grep -q '^version: 56.0.2+5602$' app/pubspec.yaml

      - name: Restore persistent release signing identity
        run: |
          set -euo pipefail
          mkdir -p signing
          gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'botx-release.jks' \
            --pattern 'botx-signing.env' \
            --dir signing --clobber
          source signing/botx-signing.env
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          cp signing/botx-release.jks app/android/app/botx-release.jks
          cat > app/android/key.properties <<EOF
          storeFile=botx-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Resolve and format targeted source
        working-directory: app
        run: |
          flutter pub get
          dart format \
            lib/app/botx_app.dart \
            lib/app/v56_native_shell.dart \
            lib/app/local_demo_engine.dart \
            test/v56_ui_smoke_test.dart \
            test/local_demo_engine_test.dart

      - name: Analyze source
        id: analyze
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log

      - name: Run only Target-8 regression tests
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          timeout 12m flutter test \
            test/local_demo_engine_test.dart \
            test/v56_ui_smoke_test.dart 2>&1 | tee ../tests.log

      - name: Build signed ARM64 release APK
        id: build
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          timeout 25m flutter build apk --release \
            --build-name=56.0.2 --build-number=5602 \
            --dart-define=BOTX_ENV=release-candidate 2>&1 | tee ../build-release.log

      - name: Package diagnostics, built APK and exact developer source
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > app/TARGET8_COMPLETION_REPORT.md <<EOF
          # BotX Pro V56.0.2 Target-8
          - Base: locked V56.0.1
          - Version: 56.0.2+5602
          - Analyze: ${{ steps.analyze.outcome }}
          - Target-8 tests: ${{ steps.tests.outcome }}
          - Android build: ${{ steps.build.outcome }}
          - Existing market identity contract: preserved
          - Theme files: unchanged by Target-8 patch
          - Old releases: not overwritten
          EOF
          rm -f app/android/app/botx-release.jks app/android/key.properties
          if test -s app/build/app/outputs/flutter-apk/app-release.apk; then
            cp app/build/app/outputs/flutter-apk/app-release.apk \
              dist/BotXPro-V56.0.2-Target8-ARM64.apk
          fi
          zip -qr dist/BotXPro-V56.0.2-Target8-Source.zip app \
            -x 'app/build/*' 'app/.dart_tool/*' 'app/*.apk' 'app/*.aab'
          cp analyze.log tests.log build-release.log dist/ 2>/dev/null || true
          (cd dist && sha256sum *.apk *.zip 2>/dev/null | tee SHA256SUMS.txt) || true

      - name: Upload Target-8 delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BotX-Pro-V56.0.2-Target8-Delivery
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce quality gates
        if: always()
        run: |
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test -s dist/BotXPro-V56.0.2-Target8-ARM64.apk
