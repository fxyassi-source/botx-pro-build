name: botx_pro_v16
publish_to: none
description: BotX Pro native Flutter application using the locked V56 Gold UI and cloud-authoritative trading.
version: 56.0.0+5600

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.0.0
  crypto: ^3.0.6
  country_flags: ^4.1.2
  simple_icons: ^16.23.0
  webview_flutter: 4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/v56/index.html
    - assets/config/endpoints.json
    - assets/manifests/
    - assets/images/
    - assets/brokers/
    - assets/video/
